[project]
name = "be"
version = "0.1.0"
description = "City Change Detection Explorer — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "scikit-image>=0.22",
  "scipy>=1.13",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["httpx>=0.27"]
